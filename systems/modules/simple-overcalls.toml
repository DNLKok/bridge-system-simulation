[[rules]]
id = "nonjump-new-suit-overcall"
try_calls = [
  "1S", "1H", "1D", "1C",
  "2S", "2H", "2D", "2C",
  "3S", "3H", "3D", "3C",
]

[rules.when]
opponent_opening_calls = ["1C", "1D", "1H", "1S", "2C", "2D", "2H", "2S"]
max_hcp = 17
nonjump_new_suit_overcall = true
suit_tie_order = ["spades", "hearts", "diamonds", "clubs"]
suit_overcall_tiers = [
  { level = 1, min_hcp = 9, min_suit_length = 5 },
  { level = 2, min_hcp = 12, min_suit_length = 5 },
  { level = 2, min_hcp = 10, min_suit_length = 6 },
  { level = 3, min_hcp = 13, min_suit_length = 5 },
  { level = 3, min_hcp = 11, min_suit_length = 6 },
]

